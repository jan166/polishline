<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polishline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style id="pl-reset">
html{color-scheme:light dark}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style id="pl-css">
/* ── tokens ─────────────────────────────────────────────── */
:root{
  --bg:#ffffff;
  --bg-2:#f5f6f7;
  --bg-3:#eceef0;
  --ink:#0f1620;
  --ink-2:#3c4a5b;
  --ink-3:#5d6878;
  --line:rgba(15,22,32,.13);
  --line-2:rgba(15,22,32,.26);
  --brand:#16233a;
  --brand-h:#22344f;
  --on-brand:#f3f6fa;

  --t1:rgba(196,176,140,.22);
  --t1-solid:#e7dfcd;
  --t1-ink:#6a5734;
  --t2:rgba(150,186,220,.22);
  --t2-solid:#d5e2ef;
  --t2-ink:#2a5479;
  --t3:rgba(174,164,201,.22);
  --t3-solid:#dfdaeb;
  --t3-ink:#4c4067;

  --dark-ground:#111a26;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1017;
    --bg-2:#111823;
    --bg-3:#171f2b;
    --ink:#eef2f7;
    --ink-2:#a9b6c6;
    --ink-3:#818f9f;
    --line:rgba(238,242,247,.14);
    --line-2:rgba(238,242,247,.24);
    --brand:#dfe7f1;
    --brand-h:#c9d5e3;
    --on-brand:#0b1017;

    --t1:rgba(196,176,140,.10);
    --t1-solid:#2b2419;
    --t1-ink:#d0bc90;
    --t2:rgba(150,186,220,.10);
    --t2-solid:#182533;
    --t2-ink:#a1c5e4;
    --t3:rgba(174,164,201,.10);
    --t3-solid:#231f2f;
    --t3-ink:#c0b5de;

    --dark-ground:#060a0f;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1017; --bg-2:#111823; --bg-3:#171f2b;
  --ink:#eef2f7; --ink-2:#a9b6c6; --ink-3:#818f9f;
  --line:rgba(238,242,247,.14); --line-2:rgba(238,242,247,.24);
  --brand:#dfe7f1; --brand-h:#c9d5e3; --on-brand:#0b1017;
  --t1:rgba(196,176,140,.10); --t1-solid:#2b2419; --t1-ink:#d0bc90;
  --t2:rgba(150,186,220,.10); --t2-solid:#182533; --t2-ink:#a1c5e4;
  --t3:rgba(174,164,201,.10); --t3-solid:#231f2f; --t3-ink:#c0b5de;
  --dark-ground:#060a0f;
}

/* ── base ───────────────────────────────────────────────── */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.72;letter-spacing:-.006em;
  word-break:keep-all;overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,figure{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--t2-ink);outline-offset:3px}
svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.ser{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

.d1{font-size:clamp(27px,4.1vw,50px);line-height:1.14;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.d2{font-size:clamp(24px,3.6vw,40px);line-height:1.2;font-weight:700;letter-spacing:-.024em;text-wrap:balance}
.d3{font-size:clamp(21px,2.4vw,29px);line-height:1.3;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.d4{font-size:clamp(17px,1.5vw,20px);line-height:1.42;font-weight:600;letter-spacing:-.014em}
.lead{font-size:clamp(15px,1.5vw,22px);line-height:1.5;font-weight:400;color:var(--ink-2)}
.body{font-size:15px;color:var(--ink-2)}
.small{font-size:13.5px;color:var(--ink-3)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}

/* ── header ─────────────────────────────────────────────── */
header{position:fixed;inset:0 0 auto;z-index:60;padding:12px 0;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
header.stuck{border-bottom-color:var(--line)}
.hdr{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:baseline;gap:7px;flex-shrink:0}
.logo b{font-size:19px;font-weight:700;letter-spacing:-.03em}
.logo span{font-size:13px;color:var(--ink-3)}
.nav{display:flex;gap:2px;margin:0 auto}
.nav a{padding:7px 12px;border-radius:8px;font-size:14.5px;color:var(--ink-2)}
.nav a:hover{background:var(--bg-3);color:var(--ink)}
.hdr__end{display:flex;align-items:center;gap:6px;flex-shrink:0}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.lang button{padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.btn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 20px;
  border-radius:999px;font-size:14.5px;font-weight:500;white-space:nowrap;transition:.16s}
.btn--fill{background:var(--brand);color:var(--on-brand)}
.btn--fill:hover{background:var(--brand-h)}
.btn--line{border:1px solid var(--line-2);color:var(--ink)}
.btn--line:hover{background:var(--bg-3)}
.btn svg{width:17px;height:17px;transition:transform .18s}
.btn:hover svg{transform:translateX(3px)}
.btn--sm{height:38px;padding:0 15px;font-size:13.5px}

/* ── hero ───────────────────────────────────────────────── */
.hero{padding-top:64px;padding-bottom:0;
  background:linear-gradient(180deg,var(--bg-3) 0%,var(--bg) 94%);overflow:hidden}
.hero__top{text-align:center;padding:34px 24px 0;display:flex;flex-direction:column;gap:20px;align-items:center}
.hero__top .btn{margin-top:2px}

/* The tabs are a rule, not a capsule: a second capsule under the CTA read as
   a second button. The rule runs the width of the frame it controls. */
.hero__tabsrow{padding:0 24px;margin-top:34px}
.hero__tabs{max-width:1160px;margin:0 auto;display:flex;justify-content:center;
  border-bottom:.5px solid var(--line-2)}
.hero__tabs button{position:relative;padding:10px 24px 12px;
  font-size:16.5px;font-weight:600;letter-spacing:-.016em;color:var(--ink-3);transition:color .16s}
.hero__tabs button + button{border-left:.5px solid var(--line)}
.hero__tabs button:hover{color:var(--ink-2)}
.hero__tabs button[aria-selected="true"]{color:var(--ink)}
.hero__tabs button[aria-selected="true"]::after{content:"";position:absolute;
  left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.hero__grid-outer{margin-top:72px;display:flex;align-items:stretch;
  border-top:.5px solid var(--line-2);border-bottom:.5px solid var(--line-2)}
.hero__flank{flex:1;border-right:.5px solid var(--line-2)}
.hero__flank--r{border-right:0;border-left:.5px solid var(--line-2)}
.hero__grid{display:flex;width:100%;max-width:1200px}
.hcard{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;
  justify-content:space-between;gap:40px;min-height:246px;padding:38px 24px;
  border-right:.5px solid var(--line-2);overflow:hidden;transition:background .2s}
.hcard:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.hcard__gap{width:16px;flex:0 0 16px;border-right:.5px solid var(--line-2)}
.hcard__art{position:absolute;right:-6px;top:22px;bottom:22px;width:46%;
  opacity:.42;pointer-events:none;display:flex;align-items:center;justify-content:flex-end}
.hcard__art svg{width:100%;height:auto;max-height:100%}
.hcard--1 .hcard__art,.hcard--1 .eyebrow,.hcard--1 .hcard__cta{color:var(--t1-ink)}
.hcard--2 .hcard__art,.hcard--2 .eyebrow,.hcard--2 .hcard__cta{color:var(--t2-ink)}
.hcard--3 .hcard__art,.hcard--3 .eyebrow,.hcard--3 .hcard__cta{color:var(--t3-ink)}
.hcard__head{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px}
.wm{display:flex;align-items:baseline;gap:9px}
.wm b{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.wm i{font-family:"Instrument Serif",Georgia,serif;font-style:italic;
  font-size:20px;color:var(--ink-2);line-height:1}
.hcard__cta{position:relative;z-index:1;align-self:flex-start;
  display:inline-flex;align-items:center;gap:5px;height:44px;padding:0 18px;
  border:1px solid currentColor;border-radius:999px;font-size:14px;font-weight:500;transition:gap .18s}
.hcard:hover .hcard__cta{gap:10px}
.hcard__cta svg{width:17px;height:17px}

/* ── marquee ────────────────────────────────────────────── */
.marq{display:flex;flex-direction:column;gap:28px;align-items:center;
  padding-bottom:96px;background:var(--bg)}
.marq__label{font-size:14px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.marq__row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:clamp(40px,8vw,96px);color:var(--ink-2);padding:0 24px}
.marq__logo{display:inline-flex;align-items:center;color:inherit}
.marq__logo svg{display:block;width:auto;height:100%}
/* Three marks with very different silhouettes: a tall stacked lockup, a
   letterform, and a bubble. Sized by optical weight, not by box height. */
.marq__logo--ox{height:76px}
.marq__logo--elte{height:40px}
.marq__logo--nv{height:34px}
.marq__logo--ln{height:41px}

/* ── inline text editing ────────────────────────────────── */
.edbar{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;align-items:center;gap:8px;
  padding:8px;border:.5px solid var(--line-2);border-radius:13px;background:var(--bg);
  box-shadow:0 8px 28px rgba(15,22,32,.16);font-size:14px}
.edbar[hidden]{display:none}
.edbar__grp{display:flex;align-items:center;gap:8px}
.edbar__grp[hidden]{display:none}
.edbar__n{font-variant-numeric:tabular-nums;color:var(--ink-3);padding-left:4px}
.edbar__msg{color:var(--ink-3);padding-right:4px;max-width:220px}
.edbar__msg:empty{display:none}
.edbtn{height:34px;padding:0 13px;border-radius:9px;border:.5px solid var(--line-2);
  background:var(--bg);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;
  white-space:nowrap;overflow-wrap:normal;word-break:keep-all}
.edbtn:hover{background:var(--bg-2)}
.edbtn--go{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.edbtn--go:hover{background:var(--brand-h)}
.edbtn[disabled]{opacity:.5;cursor:default}
/* a break typed while editing lives in the DOM as a bare newline, which
   HTML would fold into a space until it is saved as <br> */
.is-editing [data-k]{outline:1px dashed var(--line-2);outline-offset:3px;border-radius:3px;
  cursor:text;white-space:pre-wrap}
.is-editing [data-k]:hover{outline-color:var(--ink-3)}
.is-editing [data-k]:focus{outline:2px solid var(--brand);outline-offset:3px}
.is-editing .marq__row{opacity:.4}

/* ── chooser ────────────────────────────────────────────── */
.chooser{background:var(--bg-2);padding:104px 24px 56px;display:flex;flex-direction:column;
  gap:34px;align-items:center;text-align:center}
.pills{display:flex;gap:6px;padding:6px;border:.5px solid var(--line-2);border-radius:999px;
  background:color-mix(in srgb,var(--bg) 84%,transparent)}
.pills button{height:46px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:700;
  letter-spacing:-.02em;color:var(--ink);opacity:.62;transition:.18s}
.pills button[aria-selected="true"]{background:var(--bg-3);opacity:1}
.pills-fixed{position:fixed;left:0;right:0;top:58px;z-index:50;display:flex;justify-content:center;
  padding:8px 0;pointer-events:none;opacity:0;transition:opacity .22s}
.pills-fixed.on{opacity:1;pointer-events:auto}
.pills-fixed .pills{backdrop-filter:blur(14px)}

/* ── product sections ───────────────────────────────────── */
.psec{border-top:.5px solid var(--line-2);border-bottom:.5px solid var(--line-2);scroll-margin-top:110px}
.psec--1{background:var(--t1)}
.psec--2{background:var(--t2)}
.psec--3{background:var(--t3)}
.psec__row{display:flex;align-items:flex-start;gap:48px;max-width:1200px;margin:0 auto;padding:0 24px}
.psec__left{width:400px;flex:0 0 400px;position:sticky;top:104px;
  padding:96px 0;display:flex;flex-direction:column;gap:44px}
.psec__lead{display:flex;flex-direction:column;gap:22px}
.psec__wm{display:flex;flex-direction:column;gap:20px}
.psec__wm .wm b{font-size:38px}
.psec__wm .wm i{font-size:24px}
.psec__acts{display:flex;gap:8px;flex-wrap:wrap}
.psec__right{flex:1;min-width:0;padding:96px 0 96px 48px;display:flex;flex-direction:column;gap:104px;
  background-image:repeating-linear-gradient(to bottom,var(--line-2) 0 1px,transparent 1px 5px);
  background-size:1px 5px;background-repeat:repeat-y;background-position:left top}
.shot{width:100%;aspect-ratio:16/9;overflow:hidden;position:relative}
.vals{display:flex;flex-direction:column;gap:44px}
.vals__list{display:flex;flex-direction:column;gap:72px}
.val{display:flex;flex-wrap:wrap-reverse;gap:24px;align-items:flex-start}
.val__shot{flex:1;min-width:min(100%,420px);aspect-ratio:16/9;overflow:hidden;position:relative}
.val__txt{flex:1;min-width:min(100%,200px);border-top:.5px solid var(--line-2);padding-top:24px}
.psec--1 .shot,.psec--1 .val__shot{background:var(--t1-solid)}
.psec--2 .shot,.psec--2 .val__shot{background:var(--t2-solid)}
.psec--3 .shot,.psec--3 .val__shot{background:var(--t3-solid)}
.psec--1 .psec__left .eyebrow{color:var(--t1-ink)}
.psec--2 .psec__left .eyebrow{color:var(--t2-ink)}
.psec--3 .psec__left .eyebrow{color:var(--t3-ink)}
.psec--1 .btn--fill{background:var(--t1-ink);color:var(--bg)}
.psec--2 .btn--fill{background:var(--t2-ink);color:var(--bg)}
.psec--3 .btn--fill{background:var(--t3-ink);color:var(--bg)}
.psec--1 .btn--line{border-color:var(--t1-ink);color:var(--t1-ink)}
.psec--2 .btn--line{border-color:var(--t2-ink);color:var(--t2-ink)}
.psec--3 .btn--line{border-color:var(--t3-ink);color:var(--t3-ink)}

.grow{padding:96px 0;
  background-image:repeating-linear-gradient(to right,var(--line-2) 0 1px,transparent 1px 5px);
  background-size:5px 1px;background-repeat:repeat-x;background-position:left top}
.grow__inner{display:flex;gap:24px;max-width:1200px;margin:0 auto;padding:0 24px;align-items:stretch}
.gcard{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:40px;
  padding:24px;background:var(--bg)}
.gcard__body{display:flex;flex-direction:column;gap:10px}
.gcard__foot{display:flex;align-items:center;gap:12px}
.gcard__mark{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;
  font-size:15px;font-weight:700;letter-spacing:-.02em}
.psec--1 + .grow .gcard__mark{background:var(--t1-solid);color:var(--t1-ink)}
.psec--2 + .grow .gcard__mark{background:var(--t2-solid);color:var(--t2-ink)}
.psec--3 + .grow .gcard__mark{background:var(--t3-solid);color:var(--t3-ink)}

/* ── safety (dark) ──────────────────────────────────────── */
.safety{position:relative;margin-top:112px;padding:112px 24px;background:var(--dark-ground);
  color:#eef2f7;display:flex;flex-direction:column;gap:34px;align-items:center;text-align:center;overflow:hidden}
.safety__glow{position:absolute;left:50%;bottom:-42%;width:min(1100px,132%);aspect-ratio:1;
  transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(150,186,220,.2) 0%,transparent 62%)}
/* must not re-position the glow, or it drops into the flow and inflates the section */
.safety>*:not(.safety__glow){position:relative;z-index:1}
.safety p{max-width:660px;color:rgba(238,242,247,.74);font-size:15.5px}
.safety .btn{background:rgba(255,255,255,.1);color:#eef2f7}
.safety .btn:hover{background:rgba(255,255,255,.18)}

/* ── pricing ────────────────────────────────────────────── */
.pricing{background:var(--bg-2);padding:112px 24px;scroll-margin-top:80px}
.pricing__head{max-width:944px;margin:0 auto;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.pricing__grid{max-width:944px;margin:44px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}
.pcard{display:flex;flex-direction:column;gap:22px;padding:26px;background:var(--bg);
  border:.5px solid var(--line-2);height:100%}
.pcard--best{border-color:var(--ink);border-width:1px}
.pcard__tag{align-self:flex-start;padding:3px 9px;font-size:11.5px;font-weight:500;
  letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg)}
.pcard__name{display:flex;flex-direction:column;gap:6px}
.pcard__price{display:flex;align-items:baseline;gap:6px}
.pcard__price b{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1}
.pcard ul{display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--ink-2);flex:1}
.pcard li{display:flex;gap:8px}
.pcard li::before{content:"";flex-shrink:0;width:14px;height:14px;margin-top:6px;
  background:currentColor;opacity:.36;
  clip-path:polygon(14% 46%,0 60%,38% 100%,100% 22%,86% 8%,37% 70%)}
.pricing__note{max-width:944px;margin:24px auto 0}

/* ── faq ────────────────────────────────────────────────── */
.faq{background:var(--bg);padding:112px 24px;scroll-margin-top:80px}
.faq__inner{max-width:944px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
.faq__list{border-top:.5px solid var(--line)}
.faq details{border-bottom:.5px solid var(--line)}
.faq summary{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  padding:22px 0;cursor:pointer;list-style:none;font-size:16px;font-weight:500;letter-spacing:-.012em}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{width:20px;height:20px;flex-shrink:0;margin-top:5px;color:var(--ink-3);transition:transform .28s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq__a{padding:0 0 24px;max-width:70ch}

/* ── footer ─────────────────────────────────────────────── */
footer{background:var(--bg-2);border-top:.5px solid var(--line)}
.foot__top{max-width:944px;margin:0 auto;padding:60px 24px 40px;display:flex;gap:88px}
.foot__brand{display:flex;flex-direction:column;gap:14px;flex-shrink:0;max-width:260px}
.foot__cols{display:flex;gap:48px;flex:1;flex-wrap:wrap}
.foot__col{display:flex;flex-direction:column;gap:12px;min-width:148px}
.foot__col h4{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.foot__col a{font-size:13.5px;color:var(--ink-2)}
.foot__col a:hover{text-decoration:underline}
.foot__bot{max-width:944px;margin:0 auto;padding:28px 24px 40px;border-top:.5px solid var(--line);
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.foot__legal{display:flex;flex-direction:column;gap:4px}

/* ── mock internals ────────────────────────────────────── */
.mk{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;gap:9px;
  font-size:12.5px;line-height:1.5}
.mk--pad{padding:22px}
.mk--mid{justify-content:center}
.mk__stack{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:9px}
.mk__bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-bottom:9px;border-bottom:.5px solid var(--line-2);font-size:11px}
.mk__row{display:flex;gap:10px;align-items:stretch}
.mk__cell{flex:1;min-width:0;padding:8px 10px;background:var(--bg);border:.5px solid var(--line)}
/* a cell placed straight into the column must not stretch to fill the frame */
.mk > .mk__cell,.mk__stack > .mk__cell{flex:0 0 auto}
.mk__cell--tgt{border-color:var(--line-2)}
.mk__cell--on{border-color:currentColor;border-width:1.5px}

.mk__lbl{font-size:10.5px;font-weight:500;margin-bottom:5px}
.mk__note{font-size:10.5px;text-align:center;opacity:.88}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;

.chip--u{background:currentColor}
.chip--u > span{color:var(--bg)}

.mk__trail{display:flex;flex-direction:column}

.mk__dot::after{content:"";position:absolute;top:15px;bottom:-9px;width:1px;background:currentColor;opacity:.3}

.mk__hl{background:color-mix(in srgb,currentColor 22%,transparent);border-radius:2px;padding:0 2px}

/* ── hero mockup: the workspace itself ──────────────────── */
.mock{background:var(--bg);padding:26px 24px 72px}
.mock__inner{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mock__eyebrow{text-align:center;color:var(--ink-3)}
.mock__cap{max-width:74ch;margin:0 auto;text-align:center}

.app{border:.5px solid var(--line-2);background:var(--bg);overflow:hidden;
  box-shadow:0 30px 64px -34px rgba(15,22,32,.42)}

/* top bar */
.app__bar{display:flex;align-items:center;gap:13px;padding:10px 14px;
  border-bottom:.5px solid var(--line);background:var(--bg-2)}
.app__dots{display:flex;gap:6px;flex-shrink:0}
.app__dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.app__title{display:flex;align-items:center;gap:9px;min-width:0}
.app__title b{font-size:13px;font-weight:600;letter-spacing:-.012em;white-space:nowrap}
.app__pair{flex-shrink:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  color:var(--ink-3);border:.5px solid var(--line-2);border-radius:999px;padding:1.5px 8px;white-space:nowrap}
.app__acts{margin-left:auto;display:flex;align-items:center;gap:5px;flex-shrink:0}
.app__acts .sep{width:1px;height:16px;background:var(--line);margin:0 3px}
.abtn{font-size:11.5px;font-weight:500;padding:4.5px 10px;border-radius:7px;
  border:.5px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.abtn--go{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* panes */
.app__body{display:flex;align-items:stretch}
.app__panes{flex:1;min-width:0;display:grid;grid-template-columns:1fr 36px 1fr;align-items:stretch}
.ph{padding:12px 16px 10px;font-size:10.5px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:.5px solid var(--line)}
.ph--gut{border-bottom:.5px solid var(--line)}
.ph--tgt{background:var(--t2)}

.cell{padding:11px 16px;border-bottom:.5px solid var(--line);min-width:0}
.cell--tgt{background:var(--t2)}
.cell--gut{border-bottom:.5px solid var(--line);color:var(--t2-ink);
  border-left:.5px solid var(--line);border-right:.5px solid var(--line);
  display:flex;align-items:stretch;padding:0}
.cell:last-child,.cell--last{border-bottom:0}

.brk{width:100%;height:100%;display:block}
.brk path{stroke-width:1;fill:none}

.ln__t{font-size:12.5px;line-height:1.62;letter-spacing:-.004em}
.cell--src .ln__t{color:var(--ink-3)}
.cell--tgt .ln__t{color:var(--ink)}
.ln__m{display:flex;align-items:center;gap:6px;margin-top:7px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;
  font-size:10px;font-weight:500;white-space:nowrap;border:.5px solid currentColor}
.tag--done{color:var(--t1-ink)}
.tag--edit{color:var(--t2-ink)}
.tag--flag{color:var(--t3-ink)}
.tag i{width:5px;height:5px;border-radius:50%;background:currentColor}
.term{background:var(--t1-solid);box-shadow:0 1px 0 var(--t1-ink);border-radius:2px;padding:0 2px}
.flagw{box-shadow:0 1px 0 var(--t3-ink);border-radius:2px;padding:0 1px}

/* sidebar */
.side{flex:0 0 264px;display:flex;flex-direction:column;overflow:hidden;
  border-left:.5px solid var(--line);background:var(--bg-2)}
.side__tabs{display:flex;gap:1px;padding:9px 9px 0;border-bottom:.5px solid var(--line)}
.side__tabs span{font-size:11px;padding:5px 8px;border-radius:7px 7px 0 0;color:var(--ink-3);white-space:nowrap}
.side__tabs span[aria-selected="true"]{color:var(--ink);background:var(--bg);
  border:.5px solid var(--line);border-bottom-color:var(--bg);margin-bottom:-.5px}
.side__body{padding:12px 11px;display:flex;flex-direction:column;gap:10px}
.scard{border:.5px solid var(--line-2);background:var(--bg);padding:10px;
  display:flex;flex-direction:column;gap:7px}
.scard__hd{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.scard__t{font-size:11.5px;line-height:1.55;color:var(--ink-2)}
.rule{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;color:var(--t1-ink);background:var(--t1-solid);border-radius:3px;padding:1.5px 6px;align-self:flex-start}
.rule--d{color:var(--ink-3);background:var(--bg-3)}

/* ask panel */
.ask__q{font-size:11.5px;line-height:1.5;color:var(--ink);padding-left:9px;
  border-left:2px solid var(--t2-ink)}
.ask__basis{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--ink-3)}

/* versions panel */
.vtrail{display:flex;flex-direction:column}
.vev{display:flex;gap:9px;padding:4px 0;font-size:11px;line-height:1.5;color:var(--ink-2)}
.vdot{position:relative;flex-shrink:0;width:7px;display:flex;justify-content:center;color:var(--t3-ink)}
.vdot::before{content:"";width:6px;height:6px;margin-top:5px;border-radius:50%;background:currentColor}
.vdot::after{content:"";position:absolute;top:13px;bottom:-4px;width:1px;background:currentColor;opacity:.32}
.vev:last-child .vdot::after{display:none}
.vev b{font-weight:600;color:var(--ink)}
.vsub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--ink-3)}
.diff{display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.5}
.diff span{padding:3px 6px;border-left:2px solid}
.diff .was{border-color:var(--t3-ink);color:var(--ink-3);text-decoration:line-through}
.diff .now{border-color:var(--t2-ink);color:var(--ink)}
.scard__acts{display:flex;gap:5px;margin-top:1px}
.scard__acts span{font-size:10.5px;font-weight:500;padding:3.5px 9px;border-radius:6px;
  border:.5px solid var(--line-2);color:var(--ink-2)}
.scard__acts .go{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* bottom bar */
.app__foot{display:flex;align-items:center;gap:12px;padding:9px 14px;
  border-top:.5px solid var(--line);background:var(--bg-2);
  font-size:10.5px;color:var(--ink-3);flex-wrap:wrap}
.app__foot .dot{width:4px;height:4px;border-radius:50%;background:var(--t1-ink)}
.meter{margin-left:auto;display:flex;align-items:center;gap:7px}
.meter__bar{width:84px;height:5px;border-radius:99px;background:var(--bg-3);overflow:hidden}
.meter__bar i{display:block;height:100%;width:38%;background:var(--t2-ink)}

@media (max-width:1040px){
  .side{display:none}
}
@media (max-width:760px){
  .mock{padding-bottom:72px}
  .app__acts{display:none}
  .app__panes{grid-template-columns:1fr 24px 1fr}
  .cell{padding:9px 11px}
  .ph{padding:10px 11px 8px}
  .ln__t{font-size:11.5px}
}


/* ── the running demonstration ───────────────────────────── */
/* no auto side margins: in a flex column they switch off the stretch */
.tour{padding:22px 0 0;display:flex;flex-direction:column;gap:11px}
.tour__head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tour__chapter{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.tour__feat{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--ink-3)}
.tour__cap{font-size:15.5px;line-height:1.55;color:var(--ink-2);max-width:84ch;min-height:2.5em}
.tour__bar{display:flex;align-items:center;gap:18px}
.tour__dots{display:flex;gap:4px;flex:1;min-width:0}
.tour__dots button{height:3px;flex:1;max-width:44px;min-width:8px;padding:0;border-radius:99px;
  background:var(--line-2);transition:background .2s}
.tour__dots button:hover{background:var(--ink-3)}
.tour__dots button.is-done{background:var(--ink-3)}
.tour__dots button.is-now{background:var(--ink)}
.tour__more{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:500;
  color:var(--ink-2);border-bottom:1px solid var(--line-2);padding-bottom:1px}
.tour__more:hover{color:var(--ink);border-bottom-color:var(--ink)}
.tour__more::after{content:"\2192";transition:transform .16s}
.tour__more:hover::after{transform:translateX(3px)}

/* what the current step is pointing at */
.is-hl{position:relative;z-index:2}
.cell.is-hl{background:color-mix(in srgb,var(--t2-ink) 8%,transparent)}
.cell--tgt.is-hl{background:color-mix(in srgb,var(--t2-ink) 15%,transparent)}
.abtn.is-hl,.scope.is-hl,.grule.is-hl,.scard__acts.is-hl{
  outline:2px solid var(--t2-ink);outline-offset:4px;border-radius:8px}
.sel{border-radius:2px;padding:0 2px;transition:background .25s}
.app[data-ch="explore"] .sel{background:color-mix(in srgb,var(--t2-ink) 26%,transparent)}

/* guidance rows */
.scope{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.scope__l{font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.chip2{font-size:10px;padding:1.5px 7px;border-radius:999px;border:.5px solid var(--line-2);
  color:var(--ink-3);white-space:nowrap}
.chip2.is-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grule{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.grule__m{display:flex;gap:4px;flex-wrap:wrap}

/* ── deeper explanation ──────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px}
.modal__scrim{position:absolute;inset:0;background:rgba(9,14,21,.52)}
.modal__box{position:relative;width:min(700px,100%);max-height:84vh;overflow-y:auto;background:var(--bg);
  border:.5px solid var(--line-2);border-radius:16px;box-shadow:0 30px 70px -22px rgba(15,22,32,.55)}
.modal__hd{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:18px 20px 14px;background:var(--bg);border-bottom:.5px solid var(--line)}
.modal__t{font-size:15.5px;font-weight:700;letter-spacing:-.018em}
.modal__x{flex-shrink:0;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-3)}
.modal__x:hover{background:var(--bg-3);color:var(--ink)}
.modal__x svg{width:18px;height:18px}
.modal__body{padding:17px 20px 24px;display:flex;flex-direction:column;gap:17px}
.modal__lead{font-size:14.5px;line-height:1.62;color:var(--ink-2)}
.modal__map{margin:0;display:flex;flex-direction:column;gap:13px}
.modal__map dt{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px}
.modal__map dd{margin:0;font-size:14px;line-height:1.62;color:var(--ink-2)}
body.modal-open{overflow:hidden}

@media (max-width:760px){
  .tour{padding-top:18px}
  .tour__cap{font-size:14px;min-height:3.6em}
  .tour__head{gap:8px}
  .tour__feat{font-size:10.5px}

  .modal__box{max-height:88vh}
}
@media (prefers-reduced-motion:reduce){

}

/* ── hotspots: a place worth pressing ────────────────────── */
.mock__inner{position:relative}
.cell--gut,.scope,.grule,.ln__m,.scard__acts,.vtrail{position:relative}

.spot{position:absolute;z-index:6;width:15px;height:15px;border-radius:50%;
  display:grid;place-items:center;background:var(--t2-ink);
  box-shadow:0 0 0 2.5px color-mix(in srgb,var(--bg) 88%,transparent);cursor:pointer}
.spot--c{top:50%;left:50%;transform:translate(-50%,-50%)}
.spot--tr{top:-7px;right:-7px}
.spot i{position:absolute;inset:0;border-radius:50%;background:var(--t2-ink);
  animation:spotPing 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.spot i:last-child{animation-delay:1.2s}
.spot::after{content:"";position:relative;width:5px;height:5px;border-radius:50%;background:var(--bg)}
.spot:hover{background:var(--ink)}
.spot:hover::after{background:var(--bg)}
.spot.is-open{background:var(--ink)}
.spot.is-open i{animation:none;opacity:0}
@keyframes spotPing{
  0%{transform:scale(1);opacity:.5}
  70%{transform:scale(3);opacity:0}
  100%{transform:scale(3);opacity:0}
}
@media (prefers-reduced-motion:reduce){ .spot i{animation:none;opacity:0} }

.pop{position:absolute;z-index:40;width:min(320px,86vw);padding:13px 15px 15px;
  background:var(--bg);border:.5px solid var(--line-2);border-radius:13px;
  box-shadow:0 16px 40px -14px rgba(15,22,32,.45)}
.pop__x{position:absolute;top:7px;right:7px;width:24px;height:24px;display:grid;place-items:center;
  border-radius:6px;color:var(--ink-3)}
.pop__x:hover{background:var(--bg-3);color:var(--ink)}
.pop__x svg{width:15px;height:15px}
.pop__t{font-size:13px;font-weight:600;letter-spacing:-.012em;padding-right:22px;margin-bottom:6px}
.pop__d{font-size:12.5px;line-height:1.58;color:var(--ink-2)}

/* ── edit mode: outline panel, block chips ──────────────── */
.edbar__sep{width:1px;height:20px;background:var(--line);flex-shrink:0}
.edbtn--ghost{border-color:transparent}

.edpanel{position:fixed;right:16px;top:72px;bottom:80px;z-index:79;width:272px;
  display:flex;flex-direction:column;border:.5px solid var(--line-2);border-radius:14px;
  background:var(--bg);box-shadow:0 10px 34px rgba(15,22,32,.18);overflow:hidden}
.edpanel__hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:13px 14px;border-bottom:.5px solid var(--line)}
.edpanel__hd b{font-size:13.5px;font-weight:600;letter-spacing:-.012em}
.edpanel__hd span{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.edlist{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.edpanel__ft{padding:11px 13px;border-top:.5px solid var(--line);
  font-size:11.5px;line-height:1.55;color:var(--ink-3)}

.edrow{display:flex;align-items:center;gap:4px;padding:6px 7px;border-radius:9px;
  border:1px solid transparent;background:var(--bg-2)}
.edrow:hover{border-color:var(--line-2)}
.edrow.is-drag{opacity:.35}
.edrow.is-over{border-color:var(--brand);border-style:dashed}
.edrow.is-off .edrow__name{opacity:.4;text-decoration:line-through}
.edrow__grip{flex-shrink:0;width:16px;height:22px;display:grid;place-items:center;
  color:var(--ink-3);cursor:grab}
.edrow__grip:active{cursor:grabbing}
.edrow__grip svg{width:13px;height:13px}
.edrow__name{flex:1;min-width:0;padding:0 2px;font-size:13px;font-weight:500;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.edrow__btn{flex-shrink:0;width:24px;height:24px;display:grid;place-items:center;
  border-radius:6px;color:var(--ink-3)}
.edrow__btn:hover{background:var(--bg-3);color:var(--ink)}
.edrow__btn[disabled]{opacity:.25;pointer-events:none}
.edrow__btn svg{width:14px;height:14px}

/* in-page block chips — only while editing */
.is-editing [data-sec]{position:relative}
.is-editing [data-sec]:hover{outline:1px dashed var(--line-2);outline-offset:-1px}
.is-editing [data-sec].is-target{outline:2px solid var(--t2-ink);outline-offset:-2px}
.secbar{display:none}
.is-editing .secbar{position:absolute;left:0;top:0;z-index:45;display:flex;align-items:center;gap:2px;
  padding:4px 6px;background:var(--bg);border-right:.5px solid var(--line-2);
  border-bottom:.5px solid var(--line-2);border-bottom-right-radius:10px}
.is-editing [data-sec="hero"] > .secbar{top:60px}
.secbar__t{font-size:11.5px;font-weight:600;color:var(--ink-2);padding:0 5px 0 1px;white-space:nowrap}
.secbar button{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3)}
.secbar button:hover{background:var(--bg-3);color:var(--ink)}
.secbar button[disabled]{opacity:.25;pointer-events:none}
.secbar svg{width:14px;height:14px}

@media (max-width:900px){
  .edbar{left:16px;flex-wrap:wrap;justify-content:flex-end}
  .edbar__grp{flex-wrap:wrap;justify-content:flex-end}
  .edbar__msg{max-width:100%}
  .edpanel{left:16px;right:16px;width:auto;top:auto;bottom:126px;height:min(44vh,320px)}
}

    for (var i = 0; i < parts.length; i++){
      var p = parts[i].trim(), dash = p.indexOf('-');
      if (dash > 0){
        if (n >= +p.slice(0, dash) && n <= +p.slice(dash + 1)) return true;
      } else if (+p === n) return true;
    }
    return false;
  }

  function buildDots(){
    if (!dotWrap) return;
    for (var i = 1; i <= LAST_STEP; i++){
      var b = document.createElement('button');
      b.type = 'button';

      b.setAttribute('aria-label', 'Step ' + i);
      dotWrap.appendChild(b);

      var b = e.target.closest ? e.target.closest('[data-goto]') : null;
      if (!b) return;
      tourStopped = true;
      stopTour();
      setStep(+b.getAttribute('data-goto'));
    });
  }

  function setStep(n){
    if (n < 1) n = 1;
    if (n > LAST_STEP) n = 1;
    step = n;
    var ch = chapterOf(n);
    var frame = app.querySelector('.app');
    if (frame) frame.setAttribute('data-ch', ch);

    app.querySelectorAll('[data-steps]').forEach(function(el){
      el.hidden = !inSpec(el.getAttribute('data-steps'), n);
    });
    app.querySelectorAll('[data-hl]').forEach(function(el){
      el.classList.toggle('is-hl', inSpec(el.getAttribute('data-hl'), n));
    });
    app.querySelectorAll('[data-cap]').forEach(function(el){
      el.hidden = +el.getAttribute('data-cap') !== n;
    });
    app.querySelectorAll('[data-chapter]').forEach(function(el){
      el.hidden = el.getAttribute('data-chapter') !== ch;
    });
    app.querySelectorAll('[data-side-tab]').forEach(function(el){
      if (el.getAttribute('data-side-tab') === SIDE_BY_STEP[n])
        el.setAttribute('aria-selected', 'true');
      else el.removeAttribute('aria-selected');
    });
    viewTabs.forEach(function(b){
      b.setAttribute('aria-selected', String(b.getAttribute('data-view') === ch));
    });
    if (typeof closePop === 'function') closePop();
    if (dotWrap) dotWrap.querySelectorAll('[data-goto]').forEach(function(b){
      var i = +b.getAttribute('data-goto');
      b.classList.toggle('is-now', i === n);
      b.classList.toggle('is-done', i < n);
    });
  }

  function stopTour(){
    if (tourTimer) clearInterval(tourTimer);
    tourTimer = null;
  }
  function playTour(){
    stopTour();
    if (tourStopped || calm) return;
    tourTimer = setInterval(function(){
      if (!tourPaused && !editing) setStep(step + 1);
    }, 3600);
  }

  /* hovering is reading, not taking over: it pauses and gives back */
  var stage = app.querySelector('.mock');
  if (stage){
    stage.addEventListener('pointerenter', function(){ tourPaused = true; });
    stage.addEventListener('pointerleave', function(){ tourPaused = false; });
    stage.addEventListener('focusin', function(){ tourPaused = true; });
    stage.addEventListener('focusout', function(){ tourPaused = false; });
  }

  viewTabs.forEach(function(b){
    b.addEventListener('click', function(){
      var ch = CHAPTERS[b.getAttribute('data-view')];
      if (!ch) return;
      setStep(ch.from);
      playTour();          /* a chapter jump keeps it running */
    });
  });

  /* deeper explanation for the chapter on screen */
  function openModal(){
    if (!modal) return;
    modal.hidden = false;
    document.body.classList.add('modal-open');
    tourPaused = true;
    var x = modal.querySelector('.modal__x');
    if (x) x.focus();
  }
  function closeModal(){
    if (!modal || modal.hidden) return;
    modal.hidden = true;
    document.body.classList.remove('modal-open');
    tourPaused = false;
  }
  /* ── hotspots ─────────────────────────────────────────────
     A pulsing mark on a region of the workspace, answering what that
     region is. Pressing one is taking the demonstration over, so the
     tour stops rather than moving the thing being asked about. */
  var pop = document.getElementById('spotPop');
  var openSpot = null;

  function closePop(){
    if (!pop || pop.hidden) return;
    pop.hidden = true;
    if (openSpot) openSpot.classList.remove('is-open');
    openSpot = null;
  }

  function placePop(spot){
    var host = app.querySelector('.mock__inner');
    if (!host || !pop) return;
    var h = host.getBoundingClientRect(), r = spot.getBoundingClientRect();
    var w = pop.offsetWidth, ht = pop.offsetHeight;
    var left = (r.left - h.left) + r.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, h.width - w - 8));
    var top = (r.top - h.top) - ht - 12;
    if (top < 4) top = (r.bottom - h.top) + 12;    /* below when there is no room above */
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  function openPopFor(spot){
    if (!pop) return;
    var key = spot.getAttribute('data-spot');
    if (openSpot === spot){ closePop(); return; }
    closePop();
    pop.querySelectorAll('[data-pop]').forEach(function(el){
      el.hidden = el.getAttribute('data-pop') !== key;
    });
    pop.hidden = false;
    placePop(spot);
    spot.classList.add('is-open');
    openSpot = spot;
    tourStopped = true;
    stopTour();
  }

  app.addEventListener('click', function(e){
    var spot = e.target.closest ? e.target.closest('[data-spot]') : null;
    if (spot){ openPopFor(spot); return; }
    var t = e.target.closest ? e.target.closest('[data-tour]') : null;
    if (t){
      var act = t.getAttribute('data-tour');
      if (act === 'more') openModal();
      else if (act === 'close') closeModal();
      else if (act === 'pop-close') closePop();
      return;
    }
    if (pop && !pop.hidden && !(e.target.closest && e.target.closest('#spotPop'))) closePop();
  });
  window.addEventListener('resize', function(){ if (openSpot) placePop(openSpot); });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    closeModal();
    closePop();
  });

  buildDots();

  /* ── inline text editing ──────────────────────────────── */
  function esc(t){
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* Read the edited field as text plus line breaks. Not innerText: that
     returns the *rendered* string, so an uppercase text-transform would be
     baked into the saved copy. A <br> — or a block the browser inserted on
     Enter — is a newline; everything else is its text. */
  function readText(n){
    var out = '';
    (function walk(el){
      for (var c = el.firstChild; c; c = c.nextSibling){
        if (c.nodeType === 3) { out += c.data; continue; }
        if (c.nodeType !== 1) continue;
        if (c.nodeName === 'BR') { out += '\n'; continue; }
        if (/^(DIV|P|LI)$/.test(c.nodeName) && out && !/\n$/.test(out)) out += '\n';
        walk(c);
      }
    })(n);
    return out;
  }

  function capture(n){
    var k = n.getAttribute('data-k');
    if (!k || !base[k]) return;
    var text = readText(n)
      .replace(/[ \t\u00a0]+/g, ' ')   /* contenteditable pads with nbsp */
      .replace(/ *\n */g, '\n')
      .replace(/\n{3,}/g, '\n\n')
      .replace(/^\n+|\n+$/g, '')
      .trim();
    var html = esc(text).replace(/\n/g, '<br>');
    var ov = doc.text;
    if (!ov[k]) ov[k] = {};
    if (html === base[k][curLang]) delete ov[k][curLang];
    else ov[k][curLang] = html;
    if (!Object.keys(ov[k]).length) delete ov[k];
    n.setAttribute('data-en',
      (ov[k] && ov[k][curLang] != null) ? ov[k][curLang] : base[k][curLang]);
    touch();
  }

  keyed.forEach(function(n){
    n.addEventListener('input', function(){ capture(n); });
    n.addEventListener('paste', function(e){
      if (CE === 'plaintext-only') return;
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text') || '';
      document.execCommand('insertText', false, t.replace(/\s+/g, ' '));
    });
    n.addEventListener('keydown', function(e){
      if (e.key === 'Escape') { n.blur(); return; }
      if (e.key !== 'Enter') return;
      /* Enter breaks the line. plaintext-only already inserts a bare
         newline; elsewhere the browser would build a <div>, so place the
         break by hand. */
      if (CE === 'plaintext-only') return;
      e.preventDefault();
      if (!document.execCommand('insertLineBreak'))
        document.execCommand('insertHTML', false, '<br>');
    });
  });

  /* In edit mode a click on the page is a caret placement, not navigation.
     The edit surfaces themselves stay clickable. */
  document.addEventListener('click', function(e){
    if (!editing) return;
    var t = e.target.closest ? e.target.closest('a,button') : null;
    if (!t) return;
    if (t.closest('#edbar') || t.closest('#edpanel') || t.closest('.secbar')
        || t.hasAttribute('data-view') || t.closest('.mock')) return;
    e.preventDefault();
    e.stopPropagation();
  }, true);

  /* the bar wraps to two or three rows on a narrow screen, so the panel
     takes its offset from the bar's measured height, not a fixed guess */
  function fitPanel(){
    if (!edpanel || edpanel.hidden) return;
    edpanel.style.bottom = ((edbar.offsetHeight || 50) + 22) + 'px';
  }

  function setPanel(on){
    panelOpen = on;
    edpanel.hidden = !(on && editing);
    edPanelBtn.setAttribute('aria-pressed', String(on));
    fitPanel();
  }

  function setEditing(on){
    editing = on;
    document.body.classList.toggle('is-editing', on);
    edStart.hidden = on;
    edLive.hidden = !on;
    edpanel.hidden = !(on && panelOpen);
    keyed.forEach(function(n){
      if (on) { n.setAttribute('contenteditable', CE); n.spellcheck = false; }
      else n.removeAttribute('contenteditable');
    });
    if (on) { renderPanel(); paintChips(); }
    paintEdit();
    fitPanel();
  }

  /* ── export ───────────────────────────────────────────── */
  var FONTS = document.querySelectorAll('link[rel="preconnect"],link[rel="stylesheet"]');

  function buildDoc(){
    var links = '';
    FONTS.forEach(function(l){ links += l.outerHTML + '\n'; });
    var data = JSON.stringify(payload()).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="' + curLang + '">\n<head>\n'
      + '<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
      + '<title>Polishline</title>\n'
      + links
      + document.getElementById('pl-reset').outerHTML + '\n'
      + document.getElementById('pl-css').outerHTML + '\n'
      + '</head>\n<body>\n'
      + '<script id="pl-data" type="application/json">' + data + '<\/script>\n'
      + document.getElementById('pl-body').outerHTML + '\n'
      + '<div id="app"></div>\n'
      + document.getElementById('pl-js').outerHTML + '\n'
      + '</body>\n</html>\n';
  }

  function download(html){
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function saved(){
    baked = JSON.stringify(payload());
    dirty = false;
    try { localStorage.removeItem(DRAFT); } catch (e) {}
    msgKey = 'saved';
    edSave.disabled = false;
    paintEdit();
  }

  function saveToFile(){
    var html = buildDoc();
    if (!window.showSaveFilePicker){ download(html); saved(); return; }
    var pick = handle ? Promise.resolve(handle) : window.showSaveFilePicker({
      suggestedName: 'index.html',
      types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
    });
    pick.then(function(h){
      handle = h;
      return h.createWritable().then(function(w){
        return Promise.resolve(w.write(html)).then(function(){ return w.close(); });
      });
    }).then(saved, function(err){
      edSave.disabled = false;
      if (err && err.name === 'AbortError'){ msgKey = 'abort'; paintEdit(); return; }
      /* the picker is unavailable in this context — fall back to a download */
      download(html);
      saved();
    });
  }

  edStart.addEventListener('click', function(){ msgKey = ''; setEditing(true); });
  edCancel.addEventListener('click', function(){ setEditing(false); });
  edPanelBtn.addEventListener('click', function(){ setPanel(!panelOpen); });

  edReset.addEventListener('click', function(){
    if (changedCount() && !window.confirm(EDLBL[curLang].confirm)) return;
    doc = normalise(JSON.parse(baked));
    applyText();
    applyOrder();
    applyVis();
    setLang(curLang);
    onScroll();
    try { localStorage.removeItem(DRAFT); } catch (e) {}
    dirty = false;
    msgKey = '';
    paintEdit();
  });

  edCopy.addEventListener('click', function(){
    var html = buildDoc();
    function ok(){ msgKey = 'copied'; paintEdit(); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      /* a blocked clipboard leaves writeText pending for good, so give it a
         deadline and fall back to the selection copy */
      var settled = false;
      var timer = setTimeout(function(){
        if (settled) return;
        settled = true;
        legacy();
      }, 1200);
      navigator.clipboard.writeText(html).then(function(){
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        ok();
      }, function(){
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        legacy();
      });
    } else legacy();
    function legacy(){
      var ta = document.createElement('textarea');
      ta.value = html;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); ok(); }
      catch (e) { msgKey = 'fail'; paintEdit(); }
      ta.remove();
    }
  });

  edSave.addEventListener('click', function(){
    edSave.disabled = true;
    msgKey = 'saving';
    paintEdit();
    if (!artifact){ saveToFile(); return; }
    artifact.publish(buildDoc()).then(function(){
      saved();
      setEditing(false);
    }, function(err){
      var code = err && err.code;
      edSave.disabled = false;
      if (code === 'conflict') msgKey = 'conflict';
      else if (code === 'not_granted' || code === 'not_writer'){
        setEditing(false);
        edbar.hidden = true;
        return;
      } else msgKey = 'fail';
      paintEdit();
    });
  });

  edDraft.addEventListener('click', function(){
    try { doc = normalise(JSON.parse(draftRaw)); } catch (e) { return; }
    applyText();
    applyOrder();
    applyVis();
    setLang(curLang);
    onScroll();
    edDraft.hidden = true;
    touch();
  });

  window.addEventListener('beforeunload', function(e){
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });

  /* ── boot ─────────────────────────────────────────────── */
  applyText();
  applyOrder();
  applyVis();
  buildChips();

  setLang();
  setStep(1);
  playTour();
  onScroll();

  try { draftRaw = localStorage.getItem(DRAFT); } catch (e) {}
  if (draftRaw === baked) draftRaw = null;

  function openBar(){
    edbar.hidden = false;
    edDraft.hidden = !draftRaw;
    paintEdit();
  }

  /* One file, two contexts. The working copy is the file on disk, where the
     edit button is right there. A published copy is served over http(s) and
     stays a plain landing page; #edit still opens editing on either, and
     #clean hides the button on either. */
  function has(flag){
    return location.hash === '#' + flag || new RegExp('[?&]' + flag + '=1(&|$)').test(location.search);
  }
  var ON_DISK = location.protocol === 'file:';
  if (has('edit') || (ON_DISK && !has('clean'))){
    openBar();
    if (has('edit')) setEditing(true);
  }

  /* Adding #edit to a page that is already open changes the hash without
     reloading, so honour it here too. */
  window.addEventListener('hashchange', function(){
    if (has('edit')){
      openBar();
      if (!editing) setEditing(true);
    } else if (has('clean') && !ON_DISK){
      if (editing) setEditing(false);
      edbar.hidden = true;
    }
  });

  document.addEventListener('keydown', function(e){
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    if (e.key !== 'e' && e.key !== 'E') return;
    e.preventDefault();
    openBar();
    setEditing(!editing);
  });

  /* Published as an Artifact, the same bar saves back to the artifact. */
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('artifact').then(function(a){
      if (!a) return;
      artifact = a;
      openBar();
    }, function(){});
  }
})();
</script>
</body>
</html>
